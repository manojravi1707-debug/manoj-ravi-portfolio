<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- IoT Wireless Sensor Network Mesh Background -->
  <defs>
    <g id="iot-node">
      <circle cx="0" cy="0" r="14" fill="none" stroke="rgba(212,255,63,0.35)" stroke-dasharray="2,3" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="8" fill="rgba(255,255,255,0.4)" stroke="rgba(227,66,52,0.5)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#E34234"/>
    </g>
    <g id="wireless-beacon">
      <circle cx="0" cy="0" r="22" fill="none" stroke="rgba(227,66,52,0.25)" stroke-width="1"/>
      <circle cx="0" cy="0" r="15" fill="none" stroke="rgba(212,255,63,0.35)" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="8" fill="rgba(255,255,255,0.5)" stroke="#121800" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#D4FF3F"/>
    </g>
  </defs>

  <!-- Network Interconnection Grid Lines -->
  <line x1="40" y1="40" x2="120" y2="90" stroke="rgba(227,66,52,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="120" y1="90" x2="200" y2="50" stroke="rgba(212,255,63,0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="120" y1="90" x2="80" y2="180" stroke="rgba(212,255,63,0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="180" x2="190" y2="170" stroke="rgba(227,66,52,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="200" y1="50" x2="190" y2="170" stroke="rgba(227,66,52,0.25)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Placed Nodes -->
  <use href="#iot-node" x="40" y="40"/>
  <use href="#wireless-beacon" x="120" y="90"/>
  <use href="#iot-node" x="200" y="50"/>
  <use href="#iot-node" x="80" y="180"/>
  <use href="#wireless-beacon" x="190" y="170"/>
</svg>
